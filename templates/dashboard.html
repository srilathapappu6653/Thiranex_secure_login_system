{% extends "base.html" %}

{% block content %}

<div class="dashboard">

    <div class="card shadow">

        <div class="card-body text-center">

            <h1>
                Welcome, {{ username }}! 🎉
            </h1>

            <p class="lead mt-3">
                You have successfully logged into
                the secure system.
            </p>

            <div class="security-info mt-4">

                <h4>Security Features</h4>

                <p>✓ Bcrypt password hashing</p>

                <p>✓ Input validation</p>

                <p>✓ SQL injection protection</p>

                <p>✓ Secure session management</p>

            </div>

            <a
                href="{{ url_for('logout') }}"
                class="btn btn-danger mt-3">

                Logout

            </a>

        </div>

    </div>

</div>

{% endblock %}
