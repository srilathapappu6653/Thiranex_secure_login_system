{% extends "base.html" %}

{% block content %}

<div class="auth-container">

    <div class="card shadow">

        <div class="card-body">

            <h2 class="text-center mb-4">
                Create Account
            </h2>

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        minlength="3"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        minlength="8"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        name="confirm_password"
                        class="form-control"
                        minlength="8"
                        required>

                </div>

                <button
                    type="submit"
                    class="btn btn-primary w-100">

                    Register

                </button>

            </form>

            <p class="text-center mt-3">

                Already have an account?

                <a href="{{ url_for('login') }}">
                    Login
                </a>

            </p>

        </div>

    </div>

</div>

{% endblock %}
